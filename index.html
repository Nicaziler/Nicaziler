<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICAZILER | Network & Proxy Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #09090b;
            color: #e4e4e7;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glow-border {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }
        /* Custom Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #10b981;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #10b981;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-zinc-900 via-zinc-950 to-black">

    <div class="w-full max-w-md bg-zinc-900/90 border border-zinc-800 rounded-2xl p-6 glow-border backdrop-blur-md">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-zinc-800 pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-wider text-emerald-400 mono">NICAZILER</h1>
                <p class="text-xs text-zinc-400">Proxy Tunnel & Routing Dashboard</p>
            </div>
            <div class="flex items-center gap-2 bg-zinc-950 px-3 py-1.5 rounded-full border border-zinc-800">
                <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="status-text" class="text-xs text-zinc-300 mono">READY</span>
            </div>
        </div>

        <!-- Server Node Selection -->
        <div class="mb-5">
            <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">1. เลือกโหนดเซิร์ฟเวอร์ (Tunnel Node)</label>
            <select id="server-node" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-200 text-sm rounded-xl p-3 focus:outline-none focus:border-emerald-500 transition">
                <option value="th-bkk-01">🇹🇭 Thailand - Bangkok (Low Latency ~18ms)</option>
                <option value="sg-sin-02">🇸🇬 Singapore - Asia Hub (~35ms)</option>
                <option value="jp-tyo-03">🇯🇵 Japan - Tokyo (~72ms)</option>
            </select>
        </div>

        <!-- Network Parameters / Toggles -->
        <div class="mb-6 space-y-3">
            <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">2. ตั้งค่าการส่งข้อมูล (Routing Rules)</label>
            
            <!-- Option 1 -->
            <div class="flex items-center justify-between bg-zinc-950/70 p-3.5 rounded-xl border border-zinc-800/80">
                <div>
                    <div class="text-sm font-medium text-zinc-200">UDP Fast-Path</div>
                    <div class="text-xs text-zinc-500">ลดการหน่วงของแพ็กเก็ตแบบ Real-time</div>
                </div>
                <div class="relative inline-block w-11 align-middle select-none">
                    <input type="checkbox" id="opt-udp" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-zinc-700 appearance-none cursor-pointer transition-all duration-200 top-0.5 left-0.5"/>
                    <label for="opt-udp" class="toggle-label block overflow-hidden h-6 rounded-full bg-zinc-700 cursor-pointer transition-colors duration-200"></label>
                </div>
            </div>

            <!-- Option 2 -->
            <div class="flex items-center justify-between bg-zinc-950/70 p-3.5 rounded-xl border border-zinc-800/80">
                <div>
                    <div class="text-sm font-medium text-zinc-200">DNS Smart Cache</div>
                    <div class="text-xs text-zinc-500">แคชค่า IP ปลายทางเพื่อเชื่อมต่อเร็วขึ้น</div>
                </div>
                <div class="relative inline-block w-11 align-middle select-none">
                    <input type="checkbox" id="opt-dns" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-zinc-700 appearance-none cursor-pointer transition-all duration-200 top-0.5 left-0.5"/>
                    <label for="opt-dns" class="toggle-label block overflow-hidden h-6 rounded-full bg-zinc-700 cursor-pointer transition-colors duration-200"></label>
                </div>
            </div>

            <!-- Option 3: Slider -->
            <div class="bg-zinc-950/70 p-3.5 rounded-xl border border-zinc-800/80">
                <div class="flex justify-between text-sm mb-1.5">
                    <span class="text-zinc-200">Packet Buffer Size</span>
                    <span id="buffer-val" class="text-emerald-400 mono font-semibold">512 KB</span>
                </div>
                <input type="range" id="buffer-slider" min="128" max="2048" step="128" value="512" class="w-full accent-emerald-500 cursor-pointer">
            </div>
        </div>

        <!-- Console Output Box -->
        <div class="mb-6">
            <div class="text-xs text-zinc-500 mb-1.5 flex justify-between">
                <span>System Log</span>
                <span class="mono">Xray-Config Gen</span>
            </div>
            <div id="console-box" class="bg-black border border-zinc-800 rounded-xl p-3 h-24 overflow-y-auto text-xs mono text-zinc-400 space-y-1">
                <div>> System initialized.</div>
                <div>> Waiting for user configuration...</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-2.5">
            <button onclick="generateAndLaunch()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold py-3.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                สร้างลิงก์ & เชื่อมต่อ (Import to Proxy)
            </button>
            
            <button onclick="copyConfig()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-sm font-medium py-2.5 px-4 rounded-xl transition duration-200 cursor-pointer">
                คัดลอก Subscription URL
            </button>
        </div>

    </div>

    <script>
        const slider = document.getElementById('buffer-slider');
        const bufferVal = document.getElementById('buffer-val');
        const consoleBox = document.getElementById('console-box');
        let currentGeneratedLink = "";

        // อัปเดตตัวเลข Slider
        slider.addEventListener('input', (e) => {
            bufferVal.textContent = `${e.target.value} KB`;
        });

        // ฟังก์ชันเพิ่มข้อความลงในกล่อง Log
        function logMessage(msg, color = "text-zinc-400") {
            const line = document.createElement('div');
            line.className = color;
            const time = new Date().toLocaleTimeString('th-TH', { hour12: false });
            line.textContent = `[${time}] ${msg}`;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // ฟังก์ชันจำลองการสร้าง Config และเรียก Deep Link
        function generateAndLaunch() {
            const node = document.getElementById('server-node').value;
            const udp = document.getElementById('opt-udp').checked;
            const dns = document.getElementById('opt-dns').checked;
            const buffer = slider.value;

            logMessage(`Building profile for node: ${node}...`, "text-yellow-400");

            // จำลองการสร้าง URL Config (ตัวอย่างโครงสร้างลิงก์ VLESS มาตรฐาน)
            const dummyUUID = "a1b2c3d4-e5f6-7890-abcd-ef1234567890";
            const params = `type=tcp&security=tls&udp=${udp}&dns=${dns}&buf=${buffer}`;
            currentGeneratedLink = `vless://${dummyUUID}@${node}.nicaziler.example.com:443?${params}#NICAZILER-${node.toUpperCase()}`;

            // รูปแบบ Deep Link ที่แอปอย่าง Happ Proxy ใช้รับค่าจากเบราว์เซอร์
            const deepLink = `happ://add/${encodeURIComponent(currentGeneratedLink)}`;

            setTimeout(() => {
                logMessage(`Config generated successfully!`, "text-emerald-400");
                logMessage(`Triggering Deep Link: happ://add/...`, "text-blue-400");
                
                // สั่งให้เบราว์เซอร์เปิดแอป Proxy บนมือถือ (ถ้าติดตั้งไว้)
                window.location.href = deepLink;
            }, 600);
        }

        // ฟังก์ชันคัดลอกลิงก์
        function copyConfig() {
            if (!currentGeneratedLink) {
                logMessage(`กรุณากดปุ่ม "สร้างลิงก์ & เชื่อมต่อ" ก่อนคัดลอก`, "text-red-400");
                return;
            }
            navigator.clipboard.writeText(currentGeneratedLink);
            logMessage(`Copied VLESS link to clipboard!`, "text-emerald-400");
        }
    </script>
</body>
</html>
